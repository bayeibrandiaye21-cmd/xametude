<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XamÉtudes - Camarades de classe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="XamÉtudes">
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex flex-col min-h-screen">

    <!-- NAVBAR TOP -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="xam.html" class="flex items-center gap-2 hover:opacity-90 transition">
                <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-xl tracking-wider">XÉ</div>
                <span class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">XamÉtudes</span>
            </a>
            <div class="flex items-center gap-1">
                <div id="notif-bell-container"></div>
                <a href="xam.html" class="text-xs font-semibold text-slate-600 hover:text-indigo-600 transition flex items-center gap-1.5">
                    <i data-lucide="arrow-left" class="h-4 w-4"></i> <span class="hidden sm:inline">Tableau de bord</span>
                </a>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto px-4 py-8 space-y-6">

        <div>
            <h1 class="text-2xl font-extrabold text-slate-900 flex items-center gap-2">
                <i data-lucide="users" class="h-7 w-7 text-indigo-600"></i> Camarades de classe
            </h1>
            <p class="text-slate-500 text-sm mt-1">Retrouve tous les élèves inscrits sur XamÉtudes</p>
        </div>

        <div class="relative">
            <i data-lucide="search" class="h-4 w-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
            <input type="text" id="search-input" oninput="filtrerCamarades()" placeholder="Rechercher un camarade (nom, classe...)"
                class="w-full pl-10 pr-4 py-2.5 rounded-xl border border-slate-200 bg-white focus:border-indigo-500 focus:outline-none transition text-sm shadow-sm">
        </div>

        <div id="camarades-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
            <div class="col-span-full text-center text-xs text-slate-400 py-10">Chargement des camarades...</div>
        </div>

    </main>

    <script src="config.js"></script>
    <script>
        lucide.createIcons();

        let tousLesCamarades = [];
        let idUtilisateurActuel = null;

        (async () => {
            const currentUser = await verifierConnexion();
            if (!currentUser) return;
            idUtilisateurActuel = currentUser.id;

            initNotifBell('notif-bell-container', currentUser.id);
            await chargerCamarades();
        })();

        async function chargerCamarades() {
            const { data: profiles, error } = await window.supabaseClient
                .from('profiles')
                .select('*')
                .order('points', { ascending: false });

            if (error) {
                afficherToast(traduireErreur(error), 'error');
                return;
            }

            tousLesCamarades = profiles || [];
            afficherCamarades(tousLesCamarades);
        }

        function afficherCamarades(liste) {
            const grid = document.getElementById('camarades-grid');
            grid.innerHTML = '';

            if (liste.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center text-xs text-slate-400 py-10">Aucun camarade ne correspond à ta recherche.</div>';
                return;
            }

            grid.innerHTML = liste.map((p, i) => `
                <a href="profil.html?user=${p.id}" class="bg-white p-4 rounded-2xl border border-slate-200 hover:border-indigo-300 hover:shadow-md transition flex items-center gap-3 opacity-0" style="animation: fadeInUp 0.35s ease forwards; animation-delay: ${i * 30}ms;">
                    <div class="h-12 w-12 rounded-xl ${p.id === idUtilisateurActuel ? 'bg-indigo-600' : 'bg-slate-700'} text-white font-bold flex items-center justify-center text-sm flex-none">
                        ${p.initials || '??'}
                    </div>
                    <div class="overflow-hidden flex-1">
                        <div class="text-sm font-bold text-slate-800 truncate flex items-center gap-1.5">
                            ${p.name}
                            ${p.id === idUtilisateurActuel ? '<span class="text-[9px] font-bold text-indigo-600 bg-indigo-50 px-1.5 py-0.5 rounded-full">Toi</span>' : ''}
                        </div>
                        <div class="text-[11px] text-slate-500">${p.class}</div>
                        <div class="text-[10px] text-amber-600 font-semibold mt-0.5 flex items-center gap-1">
                            <i data-lucide="award" class="h-3 w-3"></i> ${p.points} points
                        </div>
                    </div>
                </a>
            `).join('');

            lucide.createIcons();
        }

        function filtrerCamarades() {
            const requete = document.getElementById('search-input').value.trim().toLowerCase();
            const filtres = tousLesCamarades.filter(p =>
                p.name.toLowerCase().includes(requete) || p.class.toLowerCase().includes(requete)
            );
            afficherCamarades(filtres);
        }
    </script>

    <style>
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
