<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XamÉtudes - Détail de l'exercice</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="XamÉtudes">
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex flex-col min-h-screen">

    <!-- NAVBAR TOP -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <a href="xam.html" class="flex items-center gap-2 hover:opacity-90 transition">
                <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-xl tracking-wider">XÉ</div>
                <span class="text-xl font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">XamÉtudes</span>
            </a>

            <div class="flex items-center gap-1">
                <div id="notif-bell-container"></div>
                <a href="xam.html" class="text-xs font-semibold text-slate-600 hover:text-indigo-600 transition flex items-center gap-1.5">
                    <i data-lucide="arrow-left" class="h-4 w-4"></i> Retour au tableau de bord
                </a>
            </div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL -->
    <main class="flex-1 max-w-4xl w-full mx-auto px-4 py-8 space-y-6">

        <div id="loading-state" class="text-center text-sm text-slate-400 py-20">Chargement de l'exercice...</div>

        <div id="content" class="hidden space-y-6">

            <!-- QUESTION PRINCIPALE -->
            <article class="bg-white rounded-2xl p-6 sm:p-8 border border-slate-200 shadow-sm space-y-4">
                
                <!-- Badges & Métadonnées -->
                <div class="flex flex-wrap items-center justify-between gap-3">
                    <div class="flex items-center gap-2">
                        <span id="ex-subject" class="bg-indigo-100 text-indigo-700 font-bold text-xs px-3 py-1 rounded-full"></span>
                        <span id="ex-level" class="bg-slate-100 text-slate-600 font-medium text-xs px-2.5 py-1 rounded-full"></span>
                    </div>
                    <div class="flex items-center gap-3">
                        <div class="flex items-center gap-1.5 bg-amber-50 border border-amber-200 text-amber-700 px-3 py-1 rounded-full text-xs font-bold">
                            <i data-lucide="award" class="h-4 w-4 text-amber-500"></i> +<span id="ex-reward">20</span> Points à gagner
                        </div>
                        <div id="ex-owner-actions" class="hidden flex items-center gap-3">
                            <button id="ex-edit-btn" class="text-xs font-semibold text-slate-500 hover:text-indigo-600 transition flex items-center gap-1">
                                <i data-lucide="edit-3" class="h-3.5 w-3.5"></i> Modifier
                            </button>
                            <button id="ex-delete-btn" class="text-xs font-semibold text-slate-500 hover:text-red-600 transition flex items-center gap-1">
                                <i data-lucide="trash-2" class="h-3.5 w-3.5"></i> Supprimer
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Titre -->
                <h1 id="ex-title" class="text-xl sm:text-2xl font-bold text-slate-900"></h1>

                <!-- Profil de l'auteur -->
                <div class="flex items-center gap-3 pt-1 border-b border-slate-100 pb-4">
                    <div id="ex-author-avatar" class="h-10 w-10 rounded-full bg-emerald-600 text-white font-bold flex items-center justify-center text-sm">??</div>
                    <div>
                        <div id="ex-author-name" class="text-xs font-bold text-slate-800"></div>
                        <div id="ex-date" class="text-[10px] text-slate-400"></div>
                    </div>
                </div>

                <!-- Corps de la question -->
                <div id="ex-description" class="text-sm text-slate-700 leading-relaxed space-y-3 pt-2 whitespace-pre-line"></div>

                <!-- Pièce jointe / Image -->
                <div id="ex-image-container" class="hidden pt-2">
                    <img id="ex-image" src="" alt="Photo de l'exercice" class="rounded-xl border border-slate-200 max-w-full max-h-96 object-contain">
                </div>

                <!-- FORMULAIRE D'ÉDITION DE L'EXERCICE (masqué par défaut) -->
                <div id="ex-edit-form" class="hidden space-y-4 pt-4 border-t border-slate-100">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Matière</label>
                            <select id="edit-ex-subject" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-sm">
                                <option value="Mathématiques">Mathématiques</option>
                                <option value="Physique-Chimie">Physique - Chimie</option>
                                <option value="SVT">Sciences de la Vie et de la Terre (SVT)</option>
                                <option value="Philosophie">Philosophie</option>
                                <option value="Français">Français</option>
                                <option value="Anglais">Anglais</option>
                                <option value="Histoire-Géo">Histoire - Géographie</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Niveau / Classe</label>
                            <select id="edit-ex-level" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-sm">
                                <option value="Terminale S2">Terminale S2</option>
                                <option value="Terminale S1">Terminale S1</option>
                                <option value="Terminale L">Terminale L</option>
                                <option value="Première S">Première S</option>
                                <option value="Première L">Première L</option>
                                <option value="Seconde">Seconde</option>
                            </select>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Titre</label>
                        <input type="text" id="edit-ex-title" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Description</label>
                        <textarea id="edit-ex-description" rows="5" class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-sm"></textarea>
                    </div>
                    <p class="text-[11px] text-slate-400">La photo jointe (si tu en as ajouté une) ne peut pas être changée ici — supprime et republie l'exercice si besoin.</p>
                    <div class="flex justify-end gap-2">
                        <button type="button" id="ex-edit-cancel-btn" class="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-xl transition">Annuler</button>
                        <button type="button" id="ex-edit-save-btn" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition">Enregistrer</button>
                    </div>
                </div>

            </article>

            <!-- SECTION RÉPONSES -->
            <section class="space-y-4">
                <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
                    <i data-lucide="message-square" class="h-5 w-5 text-indigo-600"></i>
                    Réponses des camarades (<span id="answers-count">0</span>)
                </h2>

                <div id="answers-list" class="space-y-4">
                    <!-- Généré dynamiquement en JS -->
                </div>
            </section>

            <!-- FORMULAIRE POUR RÉPONDRE -->
            <section class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm space-y-4">
                <h3 class="text-sm font-bold text-slate-800 uppercase tracking-wider">Proposer ta solution</h3>
                
                <form id="reply-form" class="space-y-4">
                    <textarea id="reply-content" rows="4" required placeholder="Explique clairement ta démarche étape par étape..."
                              class="w-full px-4 py-3 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-sm"></textarea>

                    <div>
                        <input type="file" id="reply-image-input" accept="image/*" class="hidden">

                        <div id="reply-image-preview" class="hidden flex items-center gap-2 bg-indigo-50 border border-indigo-200 text-indigo-700 px-3 py-2 rounded-xl text-xs font-semibold mb-2">
                            <i data-lucide="image" class="h-3.5 w-3.5 flex-none"></i>
                            <span id="reply-image-name" class="truncate flex-1"></span>
                            <button type="button" id="reply-image-remove-btn" class="text-indigo-400 hover:text-red-500 font-bold flex-none">
                                <i data-lucide="x" class="h-3.5 w-3.5"></i>
                            </button>
                        </div>

                        <button type="button" id="reply-image-btn" class="flex items-center gap-1.5 text-xs font-semibold text-slate-500 hover:text-indigo-600 transition">
                            <i data-lucide="camera" class="h-3.5 w-3.5"></i> Ajouter une photo (optionnel)
                        </button>
                    </div>

                    <div class="flex items-center justify-end pt-2">
                        <button type="submit" id="reply-submit-btn" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl shadow-md shadow-indigo-200 transition flex items-center gap-2 disabled:opacity-50">
                            <i data-lucide="send" class="h-4 w-4"></i> <span id="reply-submit-label">Envoyer ma réponse</span>
                        </button>
                    </div>
                </form>
            </section>

        </div>

    </main>

    <script src="config.js"></script>
    <script>
        lucide.createIcons();

        let currentUser = null;
        let exerciseId = null;
        let exerciseOwnerId = null;
        let exerciseTitle = null;
        let exerciseData = null;

        const subjectColors = {
            "Mathématiques": "bg-indigo-100 text-indigo-700",
            "Physique-Chimie": "bg-blue-100 text-blue-700",
            "SVT": "bg-emerald-100 text-emerald-700",
            "Philosophie": "bg-violet-100 text-violet-700",
            "Français": "bg-pink-100 text-pink-700",
            "Anglais": "bg-amber-100 text-amber-700",
            "Histoire-Géo": "bg-orange-100 text-orange-700"
        };

        (async () => {
            currentUser = await verifierConnexion();
            if (!currentUser) return;

            initNotifBell('notif-bell-container', currentUser.id);

            const params = new URLSearchParams(window.location.search);
            exerciseId = params.get('id');

            if (!exerciseId) {
                document.getElementById('loading-state').textContent = "Aucun exercice sélectionné.";
                return;
            }

            await chargerExercice();
            await chargerReponses();
        })();

        function initiales(nom) {
            if (!nom) return '??';
            return nom.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            return "Publié le " + d.toLocaleDateString('fr-FR') + " à " + d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        }

        async function chargerExercice() {
            const { data: ex, error } = await window.supabaseClient
                .from('exercises')
                .select('*, profiles(name, initials)')
                .eq('id', exerciseId)
                .single();

            if (error || !ex) {
                document.getElementById('loading-state').textContent = "Cet exercice est introuvable.";
                return;
            }

            exerciseData = ex;

            document.getElementById('ex-subject').textContent = ex.subject;
            document.getElementById('ex-subject').className = 'font-bold text-xs px-3 py-1 rounded-full ' + (subjectColors[ex.subject] || 'bg-indigo-100 text-indigo-700');
            document.getElementById('ex-level').textContent = ex.level;
            document.getElementById('ex-reward').textContent = ex.reward_points;
            document.getElementById('ex-title').textContent = ex.title;
            document.getElementById('ex-author-name').textContent = ex.profiles?.name || 'Élève';
            document.getElementById('ex-author-avatar').textContent = ex.profiles?.initials || initiales(ex.profiles?.name);
            document.getElementById('ex-date').textContent = formatDate(ex.created_at);
            document.getElementById('ex-description').textContent = ex.description;

            exerciseOwnerId = ex.user_id;
            exerciseTitle = ex.title;

            if (ex.image_url) {
                document.getElementById('ex-image').src = ex.image_url;
                document.getElementById('ex-image-container').classList.remove('hidden');
            }

            if (currentUser && currentUser.id === exerciseOwnerId) {
                document.getElementById('ex-owner-actions').classList.remove('hidden');
            }

            document.getElementById('loading-state').classList.add('hidden');
            document.getElementById('content').classList.remove('hidden');
        }

        // ============================================
        // MODIFIER / SUPPRIMER SON PROPRE EXERCICE
        // ============================================
        const exTitleEl = document.getElementById('ex-title');
        const exDescriptionEl = document.getElementById('ex-description');
        const exEditForm = document.getElementById('ex-edit-form');

        document.getElementById('ex-edit-btn').addEventListener('click', () => {
            document.getElementById('edit-ex-subject').value = exerciseData.subject;
            document.getElementById('edit-ex-level').value = exerciseData.level;
            document.getElementById('edit-ex-title').value = exerciseData.title;
            document.getElementById('edit-ex-description').value = exerciseData.description;

            exTitleEl.classList.add('hidden');
            exDescriptionEl.classList.add('hidden');
            exEditForm.classList.remove('hidden');
        });

        document.getElementById('ex-edit-cancel-btn').addEventListener('click', () => {
            exEditForm.classList.add('hidden');
            exTitleEl.classList.remove('hidden');
            exDescriptionEl.classList.remove('hidden');
        });

        document.getElementById('ex-edit-save-btn').addEventListener('click', async () => {
            const subject = document.getElementById('edit-ex-subject').value;
            const level = document.getElementById('edit-ex-level').value;
            const title = document.getElementById('edit-ex-title').value.trim();
            const description = document.getElementById('edit-ex-description').value.trim();

            if (!title || !description) {
                afficherToast('Le titre et la description ne peuvent pas être vides.', 'error');
                return;
            }

            const { error } = await window.supabaseClient
                .from('exercises')
                .update({ subject, level, title, description })
                .eq('id', exerciseId);

            if (error) {
                afficherToast(traduireErreur(error), 'error');
                return;
            }

            afficherToast('Exercice mis à jour !', 'success');
            exEditForm.classList.add('hidden');
            exTitleEl.classList.remove('hidden');
            exDescriptionEl.classList.remove('hidden');
            await chargerExercice();
        });

        document.getElementById('ex-delete-btn').addEventListener('click', async () => {
            if (!confirm('Supprimer définitivement cet exercice et toutes ses réponses ? Cette action est irréversible.')) return;

            try {
                await window.supabaseClient.from('answers').delete().eq('exercise_id', exerciseId);

                const { error } = await window.supabaseClient.from('exercises').delete().eq('id', exerciseId);
                if (error) throw error;

                afficherToast('Exercice supprimé.', 'success');
                setTimeout(() => window.location.href = 'xam.html', 600);
            } catch (err) {
                console.error(err);
                afficherToast(traduireErreur(err), 'error');
            }
        });

        // ============================================
        // AFFICHAGE DES RÉPONSES
        // ============================================
        async function chargerReponses() {
            const { data: answers, error } = await window.supabaseClient
                .from('answers')
                .select('*, profiles(name, initials)')
                .eq('exercise_id', exerciseId)
                .order('created_at', { ascending: true });

            if (error) {
                console.error(error);
                return;
            }

            const list = document.getElementById('answers-list');
            document.getElementById('answers-count').textContent = answers.length;

            if (answers.length === 0) {
                list.innerHTML = '<div class="text-center text-xs text-slate-400 py-6 bg-white rounded-2xl border border-slate-200">Aucune réponse pour le moment. Sois le premier à aider !</div>';
                return;
            }

            list.innerHTML = answers.map(a => `
                <div class="bg-white rounded-2xl p-6 border ${a.is_validated ? 'border-emerald-200' : 'border-slate-200'} shadow-sm space-y-3 relative" data-answer-id="${a.id}">
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                            <div class="h-9 w-9 rounded-full bg-violet-600 text-white font-bold flex items-center justify-center text-xs">${a.profiles?.initials || initiales(a.profiles?.name)}</div>
                            <div>
                                <div class="text-xs font-bold text-slate-800">${a.profiles?.name || 'Élève'}</div>
                                <div class="text-[10px] text-slate-400">${formatDate(a.created_at)}</div>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            ${a.is_validated ? `
                            <span class="bg-emerald-50 text-emerald-700 border border-emerald-200 text-[11px] font-bold px-2.5 py-1 rounded-lg flex items-center gap-1">
                                <i data-lucide="check-circle" class="h-3.5 w-3.5 text-emerald-600"></i> Solution validée
                            </span>` : ''}
                            ${(currentUser && a.user_id === currentUser.id) ? `
                            <button onclick="modifierReponse('${a.id}')" title="Modifier" class="text-slate-300 hover:text-indigo-600 transition p-1">
                                <i data-lucide="edit-3" class="h-3.5 w-3.5"></i>
                            </button>
                            <button onclick="supprimerReponse('${a.id}')" title="Supprimer" class="text-slate-300 hover:text-red-500 transition p-1">
                                <i data-lucide="trash-2" class="h-3.5 w-3.5"></i>
                            </button>` : ''}
                        </div>
                    </div>
                    <div id="content-${a.id}" class="text-sm text-slate-700 leading-relaxed pt-2 whitespace-pre-line" data-raw="${encodeURIComponent(a.content)}">${a.content.replace(/</g, '&lt;')}</div>
                    ${a.image_url ? `
                    <div class="pt-1">
                        <a href="${a.image_url}" target="_blank">
                            <img src="${a.image_url}" alt="Photo de la réponse" class="rounded-xl border border-slate-200 max-w-full max-h-72 object-contain">
                        </a>
                    </div>` : ''}
                    ${(!a.is_validated && currentUser && exerciseOwnerId === currentUser.id) ? `
                    <div class="pt-2 border-t border-slate-100">
                        <button onclick="validerReponse('${a.id}')" class="text-xs font-bold text-emerald-700 bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 px-3 py-1.5 rounded-lg transition flex items-center gap-1.5">
                            <i data-lucide="check-circle" class="h-3.5 w-3.5"></i> Marquer comme solution correcte
                        </button>
                    </div>` : ''}
                </div>
            `).join('');

            lucide.createIcons();
        }

        // ============================================
        // MODIFIER / SUPPRIMER SA PROPRE RÉPONSE
        // ============================================
        function modifierReponse(answerId) {
            const contentEl = document.getElementById('content-' + answerId);
            if (!contentEl) return;
            const texteActuel = decodeURIComponent(contentEl.dataset.raw);

            contentEl.outerHTML = `
                <div id="content-${answerId}" class="pt-2 space-y-2">
                    <textarea id="edit-textarea-${answerId}" rows="4" class="w-full px-3 py-2 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-sm">${texteActuel}</textarea>
                    <div class="flex justify-end gap-2">
                        <button onclick="chargerReponses()" class="px-3 py-1.5 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-lg transition">Annuler</button>
                        <button onclick="enregistrerEditionReponse('${answerId}')" class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-lg transition">Enregistrer</button>
                    </div>
                </div>
            `;
        }

        async function enregistrerEditionReponse(answerId) {
            const nouveauTexte = document.getElementById('edit-textarea-' + answerId).value.trim();
            if (!nouveauTexte) return;

            const { error } = await window.supabaseClient.from('answers').update({ content: nouveauTexte }).eq('id', answerId);

            if (error) {
                afficherToast(traduireErreur(error), 'error');
                return;
            }

            afficherToast('Réponse modifiée.', 'success');
            await chargerReponses();
        }

        async function supprimerReponse(answerId) {
            if (!confirm('Supprimer définitivement cette réponse ?')) return;

            const { error } = await window.supabaseClient.from('answers').delete().eq('id', answerId);

            if (error) {
                afficherToast(traduireErreur(error), 'error');
                return;
            }

            afficherToast('Réponse supprimée.', 'success');
            await chargerReponses();
        }

        // ============================================
        // PHOTO JOINTE À LA RÉPONSE
        // ============================================
        const replyImageInput = document.getElementById('reply-image-input');
        const replyImageBtn = document.getElementById('reply-image-btn');
        const replyImagePreview = document.getElementById('reply-image-preview');
        const replyImageName = document.getElementById('reply-image-name');
        const replyImageRemoveBtn = document.getElementById('reply-image-remove-btn');

        replyImageBtn.addEventListener('click', () => replyImageInput.click());

        replyImageInput.addEventListener('change', () => {
            const file = replyImageInput.files[0];
            if (!file) return;

            if (file.size > 5 * 1024 * 1024) {
                afficherToast('Cette photo dépasse 5 Mo, choisis-en une plus légère.', 'error');
                replyImageInput.value = '';
                return;
            }

            replyImageName.textContent = file.name;
            replyImageBtn.classList.add('hidden');
            replyImagePreview.classList.remove('hidden');
        });

        function annulerReplyImage() {
            replyImageInput.value = '';
            replyImagePreview.classList.add('hidden');
            replyImageBtn.classList.remove('hidden');
        }
        replyImageRemoveBtn.addEventListener('click', annulerReplyImage);

        document.getElementById('reply-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const content = document.getElementById('reply-content').value.trim();
            if (!content || !currentUser) return;

            const btn = document.getElementById('reply-submit-btn');
            const label = document.getElementById('reply-submit-label');
            btn.disabled = true;
            label.textContent = 'Envoi en cours...';

            let imageUrl = null;
            const imageFile = replyImageInput.files[0];
            if (imageFile) {
                try {
                    const fileExt = imageFile.name.split('.').pop();
                    const fileName = `${currentUser.id}-${Date.now()}.${fileExt}`;

                    const { error: uploadError } = await window.supabaseClient
                        .storage
                        .from('exercice-images')
                        .upload(fileName, imageFile);

                    if (uploadError) throw uploadError;

                    const { data: urlData } = window.supabaseClient
                        .storage
                        .from('exercice-images')
                        .getPublicUrl(fileName);

                    imageUrl = urlData.publicUrl;
                } catch (uploadErr) {
                    afficherToast(traduireErreur(uploadErr), 'error');
                    btn.disabled = false;
                    label.textContent = 'Envoyer ma réponse';
                    return;
                }
            }

            const { error } = await window.supabaseClient
                .from('answers')
                .insert({ exercise_id: exerciseId, user_id: currentUser.id, content: content, image_url: imageUrl });

            if (error) {
                afficherToast(traduireErreur(error), 'error');
                btn.disabled = false;
                label.textContent = 'Envoyer ma réponse';
                return;
            }

            try {
                await window.supabaseClient.rpc('increment_solved_count', { p_user_id: currentUser.id });
            } catch (statErr) {
                console.warn("Stat non mise à jour (non bloquant) :", statErr);
            }

            if (exerciseOwnerId && exerciseOwnerId !== currentUser.id) {
                try {
                    await window.supabaseClient.from('notifications').insert({
                        user_id: exerciseOwnerId,
                        message: 'Un camarade a répondu à ta question "' + exerciseTitle + '"',
                        link: 'exercice_detail.html?id=' + exerciseId
                    });
                } catch (notifErr) {
                    console.warn("Notification non envoyée (non bloquant) :", notifErr);
                }
            }

            document.getElementById('reply-content').value = '';
            annulerReplyImage();
            btn.disabled = false;
            label.textContent = 'Envoyer ma réponse';

            afficherToast('Ta réponse a été envoyée, merci d\'avoir aidé ! (+20 points)', 'success');
            await chargerReponses();
        });

        // ============================================
        // VALIDER UNE RÉPONSE COMME SOLUTION CORRECTE
        // (réservé à l'auteur de la question, vérifié aussi côté serveur)
        // ============================================
        async function validerReponse(answerId) {
            try {
                const { error } = await window.supabaseClient.rpc('valider_reponse', { p_answer_id: answerId });
                if (error) throw error;

                afficherToast('Réponse validée comme solution ! L\'exercice est marqué "Résolu".', 'success');
                await chargerReponses();
            } catch (err) {
                console.error(err);
                afficherToast(traduireErreur(err), 'error');
            }
        }
    </script>
</body>
</html>
