<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>XamÉtudes - Professeur IA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 h-dvh flex flex-col overflow-hidden">

    <!-- HEADER -->
    <header class="bg-white border-b border-slate-200 h-14 flex-none z-30">
        <div class="h-full flex items-center justify-between px-3 gap-2">
            <button id="toggle-sidebar-btn" class="p-2 text-slate-600 hover:bg-slate-100 rounded-lg flex-none">
                <i data-lucide="menu" class="h-5 w-5"></i>
            </button>
            <div class="flex-1 flex items-center justify-center gap-2 overflow-hidden">
                <i data-lucide="graduation-cap" class="h-4 w-4 text-indigo-600 flex-none"></i>
                <h1 id="conversation-title" class="text-sm font-bold text-slate-800 truncate">Professeur IA</h1>
            </div>
            <button id="toggle-outils-btn" class="hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg flex-none">
                <i data-lucide="sliders-horizontal" class="h-5 w-5"></i>
            </button>
            <a href="xam.html" class="p-2 text-slate-400 hover:text-indigo-600 hover:bg-slate-100 rounded-lg flex-none" title="Retour au tableau de bord">
                <i data-lucide="home" class="h-5 w-5"></i>
            </a>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden relative">

        <!-- BACKDROP MOBILE -->
        <div id="backdrop" class="hidden fixed inset-0 bg-slate-900/40 z-20 md:hidden"></div>

        <!-- SIDEBAR GAUCHE : HISTORIQUE DES CONVERSATIONS -->
        <aside id="sidebar" class="absolute md:relative z-30 w-72 h-full bg-white border-r border-slate-200 flex flex-col -translate-x-full md:translate-x-0 transition-transform duration-200">
            <div class="p-3 border-b border-slate-100">
                <button id="nouvelle-conv-btn" class="w-full flex items-center justify-center gap-2 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded-xl transition">
                    <i data-lucide="plus" class="h-4 w-4"></i> Nouvelle conversation
                </button>
            </div>
            <nav id="conversations-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <p class="text-xs text-slate-400 text-center py-6 px-2">Chargement...</p>
            </nav>
        </aside>

        <!-- CENTRE : FIL DE CONVERSATION -->
        <main class="flex-1 flex flex-col overflow-hidden bg-slate-50">
            <div id="chat-thread" class="flex-1 overflow-y-auto p-4 space-y-4"></div>

            <!-- COMPOSITEUR -->
            <div class="p-3 bg-white border-t border-slate-200 flex-none">
                <div id="pdf-attache-preview" class="hidden max-w-3xl mx-auto mb-2 flex items-center gap-2 bg-indigo-50 border border-indigo-200 text-indigo-700 px-3 py-2 rounded-xl text-xs font-semibold">
                    <i data-lucide="file-text" class="h-3.5 w-3.5 flex-none"></i>
                    <span id="pdf-attache-nom" class="truncate flex-1"></span>
                    <button type="button" id="pdf-attache-remove-btn" class="text-indigo-400 hover:text-red-500 font-bold flex-none">
                        <i data-lucide="x" class="h-3.5 w-3.5"></i>
                    </button>
                </div>
                <div id="error-banner" class="hidden max-w-3xl mx-auto mb-2 p-2.5 bg-red-50 border border-red-200 text-red-700 text-xs font-semibold rounded-xl"></div>
                <form id="composer-form" class="flex items-center gap-2 max-w-3xl mx-auto">
                    <input type="file" id="pdf-input" accept="application/pdf" class="hidden">
                    <button type="button" id="attach-btn" title="Joindre le PDF d'un cours" class="p-2.5 text-slate-500 hover:text-indigo-600 hover:bg-slate-100 rounded-xl transition flex-none">
                        <i data-lucide="paperclip" class="h-4 w-4"></i>
                    </button>
                    <input type="text" id="message-input" placeholder="Pose une question ou joins un PDF à résumer..."
                           class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-sm">
                    <button type="submit" id="send-btn" class="p-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md shadow-indigo-200 transition flex-none disabled:opacity-50">
                        <i data-lucide="send" class="h-4 w-4"></i>
                    </button>
                </form>
            </div>
        </main>

        <!-- PANNEAU DROIT : OUTILS DU COURS -->
        <aside id="outils-panel" class="hidden absolute md:relative right-0 z-30 w-72 h-full bg-white border-l border-slate-200 flex-col">
            <div class="p-3 border-b border-slate-100 flex items-center justify-between flex-none">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-700">Outils du cours</h2>
                <button id="close-outils-btn" class="p-1 text-slate-400 hover:text-slate-700 md:hidden">
                    <i data-lucide="x" class="h-4 w-4"></i>
                </button>
            </div>

            <div class="flex-1 overflow-y-auto p-4 space-y-6">

                <!-- AUDIO -->
                <div class="space-y-2">
                    <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Écoute</h3>
                    <button type="button" id="lire-audio-btn" class="w-full flex items-center justify-center gap-1.5 py-2.5 bg-slate-50 border border-slate-200 hover:border-indigo-300 text-xs font-bold text-indigo-600 rounded-xl transition">
                        <i data-lucide="volume-2" class="h-4 w-4"></i> Écouter le résumé
                    </button>
                </div>

                <!-- FLASHCARDS -->
                <div class="space-y-3 border-t border-slate-100 pt-5">
                    <h3 class="text-[11px] font-bold uppercase tracking-wider text-slate-500">Flashcards de révision</h3>

                    <div id="flashcards-controls"></div>

                    <div id="flashcards-loading" class="hidden flex items-center gap-2 text-xs font-semibold text-slate-400 py-2">
                        <div class="h-3.5 w-3.5 border-2 border-slate-200 border-t-indigo-500 rounded-full animate-spin"></div>
                        Génération...
                    </div>

                    <div id="flashcard-session" class="hidden space-y-3">
                        <div id="flashcard-progress" class="text-[11px] font-semibold text-slate-400"></div>

                        <div id="flashcard-box" class="bg-slate-50 border border-slate-200 rounded-2xl p-4 min-h-[100px] flex items-center justify-center text-center cursor-pointer select-none">
                            <p id="flashcard-face" class="text-xs font-semibold text-slate-800"></p>
                        </div>
                        <p id="flashcard-hint" class="text-center text-[10px] text-slate-400">Clique sur la carte pour voir la réponse</p>

                        <div id="flashcard-actions" class="hidden grid grid-cols-2 gap-2">
                            <button type="button" id="flashcard-revoir-btn" class="py-2 bg-amber-50 border border-amber-200 text-amber-700 text-[11px] font-bold rounded-lg hover:bg-amber-100 transition">À revoir</button>
                            <button type="button" id="flashcard-maitrise-btn" class="py-2 bg-emerald-50 border border-emerald-200 text-emerald-700 text-[11px] font-bold rounded-lg hover:bg-emerald-100 transition">Je maîtrise</button>
                        </div>

                        <div id="flashcard-fin" class="hidden text-center space-y-2 py-3">
                            <i data-lucide="party-popper" class="h-5 w-5 text-indigo-500 mx-auto"></i>
                            <p id="flashcard-fin-texte" class="text-xs font-bold text-slate-800"></p>
                            <button type="button" id="flashcard-recommencer-btn" class="text-[11px] font-bold text-indigo-600 hover:text-indigo-700 transition">Recommencer</button>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

    </div>

    <script>
        lucide.createIcons();

        // ------------------------------------------------------------
        // Configuration Supabase
        // ------------------------------------------------------------
        const SUPABASE_URL = 'https://qlkheoquvvaktgggsrbq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFsa2hlb3F1dnZha3RnZ2dzcmJxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwNTAwMDQsImV4cCI6MjEwNDYyNjAwNH0.S6nvCcGS4KriIpnrsy5Cj4bb4vCMG7UpRfW_B3ZyYqY';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // ------------------------------------------------------------
        // Références DOM
        // ------------------------------------------------------------
        const sidebar = document.getElementById('sidebar');
        const outilsPanel = document.getElementById('outils-panel');
        const backdrop = document.getElementById('backdrop');
        const toggleSidebarBtn = document.getElementById('toggle-sidebar-btn');
        const toggleOutilsBtn = document.getElementById('toggle-outils-btn');
        const closeOutilsBtn = document.getElementById('close-outils-btn');
        const conversationTitleEl = document.getElementById('conversation-title');
        const conversationsListEl = document.getElementById('conversations-list');
        const nouvelleConvBtn = document.getElementById('nouvelle-conv-btn');

        const chatThread = document.getElementById('chat-thread');
        const composerForm = document.getElementById('composer-form');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const attachBtn = document.getElementById('attach-btn');
        const pdfInput = document.getElementById('pdf-input');
        const pdfAttachePreview = document.getElementById('pdf-attache-preview');
        const pdfAttacheNom = document.getElementById('pdf-attache-nom');
        const pdfAttacheRemoveBtn = document.getElementById('pdf-attache-remove-btn');
        const errorBanner = document.getElementById('error-banner');

        const lireAudioBtn = document.getElementById('lire-audio-btn');

        const flashcardsControls = document.getElementById('flashcards-controls');
        const flashcardsLoading = document.getElementById('flashcards-loading');
        const flashcardSession = document.getElementById('flashcard-session');
        const flashcardProgress = document.getElementById('flashcard-progress');
        const flashcardBox = document.getElementById('flashcard-box');
        const flashcardFace = document.getElementById('flashcard-face');
        const flashcardHint = document.getElementById('flashcard-hint');
        const flashcardActions = document.getElementById('flashcard-actions');
        const flashcardRevoirBtn = document.getElementById('flashcard-revoir-btn');
        const flashcardMaitriseBtn = document.getElementById('flashcard-maitrise-btn');
        const flashcardFin = document.getElementById('flashcard-fin');
        const flashcardFinTexte = document.getElementById('flashcard-fin-texte');
        const flashcardRecommencerBtn = document.getElementById('flashcard-recommencer-btn');

        const TAILLE_MAX_OCTETS = 3 * 1024 * 1024; // 3 Mo

        // ------------------------------------------------------------
        // État global
        // ------------------------------------------------------------
        let conversationsCache = [];
        let currentResumeId = null;    // null = nouvelle conversation pas encore créée
        let currentResumeTexte = null; // texte du résumé (sert à l'audio), null si discussion libre

        let currentFlashcards = [];
        let sessionIndex = 0;
        let sessionMaitrisees = 0;
        let carteRetournee = false;

        // ------------------------------------------------------------
        // OUVERTURE / FERMETURE DES PANNEAUX (mobile)
        // ------------------------------------------------------------
        function ouvrirSidebar() {
            sidebar.classList.remove('-translate-x-full');
            if (window.innerWidth < 768) backdrop.classList.remove('hidden');
        }
        function fermerSidebar() {
            if (window.innerWidth < 768) sidebar.classList.add('-translate-x-full');
            majBackdrop();
        }
        function ouvrirOutils() {
            outilsPanel.classList.remove('hidden');
            outilsPanel.classList.add('flex');
            if (window.innerWidth < 768) backdrop.classList.remove('hidden');
        }
        function fermerOutils() {
            if (window.innerWidth < 768) {
                outilsPanel.classList.add('hidden');
                outilsPanel.classList.remove('flex');
            }
            majBackdrop();
        }
        function majBackdrop() {
            const sidebarOuverte = window.innerWidth < 768 && !sidebar.classList.contains('-translate-x-full');
            const outilsOuvert = window.innerWidth < 768 && !outilsPanel.classList.contains('hidden');
            backdrop.classList.toggle('hidden', !(sidebarOuverte || outilsOuvert));
        }

        toggleSidebarBtn.addEventListener('click', () => {
            sidebar.classList.contains('-translate-x-full') ? ouvrirSidebar() : fermerSidebar();
        });
        toggleOutilsBtn.addEventListener('click', () => {
            outilsPanel.classList.contains('hidden') ? ouvrirOutils() : fermerOutils();
        });
        closeOutilsBtn.addEventListener('click', fermerOutils);
        backdrop.addEventListener('click', () => { fermerSidebar(); fermerOutils(); });

        // ------------------------------------------------------------
        // UTILITAIRES
        // ------------------------------------------------------------
        function fichierEnBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function afficherErreurGlobale(msg) {
            errorBanner.textContent = msg;
            errorBanner.classList.remove('hidden');
            setTimeout(() => errorBanner.classList.add('hidden'), 5000);
        }

        function afficherEtatVide() {
            chatThread.innerHTML = `
                <div class="h-full flex flex-col items-center justify-center text-center gap-3 px-6">
                    <div class="p-4 bg-indigo-50 text-indigo-600 rounded-2xl">
                        <i data-lucide="graduation-cap" class="h-8 w-8"></i>
                    </div>
                    <h2 class="text-base font-bold text-slate-800">Salut, je suis ton Professeur IA</h2>
                    <p class="text-xs text-slate-500 max-w-xs">Joins le PDF d'un cours pour que je te le résume (avec titre et matière détectés automatiquement), ou pose-moi directement une question.</p>
                </div>
            `;
            lucide.createIcons();
        }

        function ajouterBulleChat(role, contenu) {
            const estIA = role === 'ia';
            const bulle = document.createElement('div');
            bulle.className = estIA ? 'flex gap-2 max-w-xl' : 'flex gap-2 max-w-xl ml-auto flex-row-reverse';
            bulle.innerHTML = `
                <div class="h-7 w-7 rounded-full flex-none flex items-center justify-center text-xs font-bold ${estIA ? 'bg-gradient-to-br from-amber-400 to-orange-500 text-white' : 'bg-indigo-600 text-white'}">
                    ${estIA ? '🤖' : 'Toi'}
                </div>
                <div class="text-xs leading-relaxed p-3 rounded-2xl whitespace-pre-wrap ${estIA ? 'bg-white border border-slate-200 text-slate-700 rounded-tl-none shadow-sm' : 'bg-indigo-600 text-white rounded-tr-none'}">
                    ${contenu.replace(/</g, '&lt;')}
                </div>
            `;
            chatThread.appendChild(bulle);
            chatThread.scrollTop = chatThread.scrollHeight;
            return bulle;
        }

        function ajouterBulleChargement() {
            const bulle = document.createElement('div');
            bulle.className = 'flex gap-2 max-w-xl';
            bulle.innerHTML = `
                <div class="h-7 w-7 rounded-full flex-none flex items-center justify-center text-xs font-bold bg-gradient-to-br from-amber-400 to-orange-500 text-white">🤖</div>
                <div class="text-xs p-3 rounded-2xl bg-white border border-slate-200 text-slate-400 rounded-tl-none shadow-sm flex items-center gap-2">
                    <div class="h-3 w-3 border-2 border-slate-200 border-t-amber-500 rounded-full animate-spin"></div> Le professeur IA réfléchit...
                </div>
            `;
            chatThread.appendChild(bulle);
            chatThread.scrollTop = chatThread.scrollHeight;
            return bulle;
        }

        // ------------------------------------------------------------
        // SIDEBAR : LISTE DES CONVERSATIONS
        // ------------------------------------------------------------
        async function chargerConversations() {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) return;

            const { data, error } = await supabaseClient
                .from('resumes_cours')
                .select('*')
                .eq('user_id', user.id)
                .order('updated_at', { ascending: false });

            if (error) { console.error(error); return; }
            conversationsCache = data || [];
            renderConversationsList();
        }

        function renderConversationsList() {
            if (conversationsCache.length === 0) {
                conversationsListEl.innerHTML = '<p class="text-xs text-slate-400 text-center py-6 px-2">Aucune conversation pour le moment.</p>';
                return;
            }

            conversationsListEl.innerHTML = conversationsCache.map((c, i) => `
                <button data-index="${i}" class="conv-item w-full text-left p-3 rounded-xl hover:bg-slate-50 transition flex items-start gap-2 ${c.id === currentResumeId ? 'bg-indigo-50' : ''}">
                    <i data-lucide="${c.type === 'cours' ? 'graduation-cap' : 'message-circle'}" class="h-4 w-4 flex-none mt-0.5 ${c.type === 'cours' ? 'text-indigo-600' : 'text-slate-400'}"></i>
                    <div class="overflow-hidden">
                        <div class="text-xs font-bold text-slate-800 truncate">${c.titre}</div>
                        ${c.matiere ? `<div class="text-[10px] text-indigo-600 font-semibold">${c.matiere}</div>` : ''}
                    </div>
                </button>
            `).join('');

            conversationsListEl.querySelectorAll('.conv-item').forEach(btn => {
                btn.addEventListener('click', () => {
                    selectionnerConversation(conversationsCache[Number(btn.dataset.index)].id);
                    fermerSidebar();
                });
            });

            lucide.createIcons();
        }

        async function selectionnerConversation(id) {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            const { data: conv, error } = await supabaseClient.from('resumes_cours').select('*').eq('id', id).single();
            if (error || !conv) { afficherErreurGlobale('Conversation introuvable.'); return; }

            currentResumeId = conv.id;
            currentResumeTexte = conv.resume_texte;
            conversationTitleEl.textContent = conv.titre;

            if (conv.type === 'cours') {
                toggleOutilsBtn.classList.remove('hidden');
            } else {
                toggleOutilsBtn.classList.add('hidden');
                fermerOutils();
            }

            const { data: messages } = await supabaseClient
                .from('messages_prof_ia')
                .select('*')
                .eq('resume_id', id)
                .order('created_at', { ascending: true });

            chatThread.innerHTML = '';
            if (!messages || messages.length === 0) {
                afficherEtatVide();
            } else {
                messages.forEach(m => ajouterBulleChat(m.role, m.content));
            }

            currentFlashcards = [];
            if (conv.type === 'cours') chargerFlashcardsExistantes(id);

            renderConversationsList();
        }

        function nouvelleConversation() {
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            currentResumeId = null;
            currentResumeTexte = null;
            currentFlashcards = [];
            conversationTitleEl.textContent = 'Professeur IA';
            toggleOutilsBtn.classList.add('hidden');
            fermerOutils();
            afficherEtatVide();
            messageInput.value = '';
            annulerPdfAttache();
            renderConversationsList();
            fermerSidebar();
        }

        nouvelleConvBtn.addEventListener('click', nouvelleConversation);

        // ------------------------------------------------------------
        // PIÈCE JOINTE PDF
        // ------------------------------------------------------------
        attachBtn.addEventListener('click', () => pdfInput.click());

        pdfInput.addEventListener('change', () => {
            const file = pdfInput.files[0];
            if (!file) return;
            if (file.size > TAILLE_MAX_OCTETS) {
                afficherErreurGlobale('Ce PDF dépasse 3 Mo. Essaie de le compresser ou de le scanner en plus basse qualité.');
                pdfInput.value = '';
                return;
            }
            pdfAttacheNom.textContent = file.name;
            pdfAttachePreview.classList.remove('hidden');
        });

        function annulerPdfAttache() {
            pdfInput.value = '';
            pdfAttachePreview.classList.add('hidden');
        }
        pdfAttacheRemoveBtn.addEventListener('click', annulerPdfAttache);

        // ------------------------------------------------------------
        // ENVOI D'UN MESSAGE (texte seul, ou avec PDF joint)
        // ------------------------------------------------------------
        composerForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const texte = messageInput.value.trim();
            const fichier = pdfInput.files[0];
            if (!texte && !fichier) return;

            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) { afficherErreurGlobale('Tu dois être connecté pour utiliser le Professeur IA.'); return; }

            sendBtn.disabled = true;
            messageInput.value = '';

            if (chatThread.querySelector('.h-full.flex.flex-col')) chatThread.innerHTML = '';

            if (fichier) {
                ajouterBulleChat('user', texte || `📎 ${fichier.name}`);
                const bulleChargement = ajouterBulleChargement();
                annulerPdfAttache();

                try {
                    const pdfBase64 = await fichierEnBase64(fichier);
                    const response = await fetch('/api/analyser-cours', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pdfBase64, message: texte || null, userId: user.id })
                    });
                    const payload = await response.json();
                    if (!response.ok) throw new Error(payload.error || 'Erreur inconnue.');

                    bulleChargement.remove();
                    ajouterBulleChat('ia', payload.resume_texte);

                    currentResumeId = payload.conversationId;
                    currentResumeTexte = payload.resume_texte;
                    conversationTitleEl.textContent = payload.titre;
                    currentFlashcards = [];
                    toggleOutilsBtn.classList.remove('hidden');
                    await chargerConversations();

                } catch (err) {
                    console.error(err);
                    bulleChargement.remove();
                    ajouterBulleChat('ia', "Désolé, je n'ai pas pu analyser ce cours. " + (err.message || ''));
                } finally {
                    sendBtn.disabled = false;
                }

            } else {
                ajouterBulleChat('user', texte);
                const bulleChargement = ajouterBulleChargement();

                try {
                    const response = await fetch('/api/chat-cours', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ conversationId: currentResumeId, question: texte, userId: user.id })
                    });
                    const payload = await response.json();
                    if (!response.ok) throw new Error(payload.error || 'Erreur inconnue.');

                    bulleChargement.remove();
                    ajouterBulleChat('ia', payload.reponse);

                    if (!currentResumeId) {
                        currentResumeId = payload.conversationId;
                        conversationTitleEl.textContent = payload.titre || texte.slice(0, 50);
                        await chargerConversations();
                    }

                } catch (err) {
                    console.error(err);
                    bulleChargement.remove();
                    ajouterBulleChat('ia', "Désolé, je n'ai pas pu répondre. Réessaie dans un instant.");
                } finally {
                    sendBtn.disabled = false;
                }
            }
        });

        // ------------------------------------------------------------
        // AUDIO (lecture du résumé de la conversation affichée)
        // ------------------------------------------------------------
        lireAudioBtn.addEventListener('click', () => {
            if (!currentResumeTexte) return;
            if (!('speechSynthesis' in window)) {
                afficherErreurGlobale("La lecture audio n'est pas supportée par ce navigateur.");
                return;
            }

            if (window.speechSynthesis.speaking) {
                window.speechSynthesis.cancel();
                return;
            }

            const utterance = new SpeechSynthesisUtterance(currentResumeTexte);
            utterance.lang = 'fr-FR';
            utterance.rate = 0.95;

            utterance.onstart = () => {
                lireAudioBtn.innerHTML = '<i data-lucide="square" class="h-4 w-4"></i> Arrêter la lecture';
                lucide.createIcons();
            };
            utterance.onend = utterance.onerror = () => {
                lireAudioBtn.innerHTML = '<i data-lucide="volume-2" class="h-4 w-4"></i> Écouter le résumé';
                lucide.createIcons();
            };

            window.speechSynthesis.speak(utterance);
        });

        // ------------------------------------------------------------
        // FLASHCARDS : génération et session de révision
        // ------------------------------------------------------------
        function renderFlashcardsControls() {
            flashcardSession.classList.add('hidden');

            if (currentFlashcards.length === 0) {
                flashcardsControls.innerHTML = `
                    <button type="button" id="generer-flashcards-btn" class="w-full flex items-center justify-center gap-1.5 py-2.5 bg-slate-50 border border-slate-200 hover:border-indigo-300 text-xs font-bold text-indigo-600 rounded-xl transition">
                        <i data-lucide="sparkles" class="h-4 w-4"></i> Générer des flashcards
                    </button>
                `;
                lucide.createIcons();
                document.getElementById('generer-flashcards-btn').addEventListener('click', () => genererFlashcards(false));
            } else {
                flashcardsControls.innerHTML = `
                    <div class="space-y-2">
                        <p class="text-[11px] text-slate-500">${currentFlashcards.length} flashcard(s) disponible(s)</p>
                        <div class="flex items-center gap-2">
                            <button type="button" id="reviser-flashcards-btn" class="flex-1 flex items-center justify-center gap-1.5 py-2 bg-indigo-600 hover:bg-indigo-700 text-white text-[11px] font-bold rounded-lg transition">
                                <i data-lucide="play" class="h-3.5 w-3.5"></i> Réviser
                            </button>
                            <button type="button" id="regenerer-flashcards-btn" class="p-2 text-slate-400 hover:text-indigo-600 transition" title="Régénérer">
                                <i data-lucide="refresh-cw" class="h-3.5 w-3.5"></i>
                            </button>
                        </div>
                    </div>
                `;
                lucide.createIcons();
                document.getElementById('reviser-flashcards-btn').addEventListener('click', demarrerSessionFlashcards);
                document.getElementById('regenerer-flashcards-btn').addEventListener('click', () => genererFlashcards(true));
            }
        }

        async function chargerFlashcardsExistantes(resumeId) {
            const { data, error } = await supabaseClient
                .from('flashcards')
                .select('*')
                .eq('resume_id', resumeId)
                .order('created_at', { ascending: true });

            currentFlashcards = error ? [] : (data || []);
            if (error) console.error('Erreur chargement flashcards:', error);
            renderFlashcardsControls();
        }

        async function genererFlashcards(regenerer) {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || !currentResumeId) return;

            flashcardsControls.innerHTML = '';
            flashcardsLoading.classList.remove('hidden');

            try {
                const response = await fetch('/api/generer-flashcards', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ resumeId: currentResumeId, userId: user.id, regenerer })
                });
                const payload = await response.json();
                if (!response.ok) throw new Error(payload.error || 'Une erreur est survenue.');
                currentFlashcards = payload.flashcards || [];
            } catch (err) {
                console.error(err);
                afficherErreurGlobale(err.message || "Impossible de générer les flashcards pour le moment.");
            } finally {
                flashcardsLoading.classList.add('hidden');
                renderFlashcardsControls();
            }
        }

        function demarrerSessionFlashcards() {
            sessionIndex = 0;
            sessionMaitrisees = 0;
            flashcardSession.classList.remove('hidden');
            afficherCarteSession();
        }

        function afficherCarteSession() {
            carteRetournee = false;
            flashcardActions.classList.add('hidden');
            flashcardHint.classList.remove('hidden');
            flashcardFin.classList.add('hidden');
            flashcardBox.classList.remove('hidden');

            const carte = currentFlashcards[sessionIndex];
            flashcardProgress.textContent = `Carte ${sessionIndex + 1} / ${currentFlashcards.length}`;
            flashcardFace.textContent = carte.question;
        }

        flashcardBox.addEventListener('click', () => {
            if (flashcardSession.classList.contains('hidden') || carteRetournee) return;
            const carte = currentFlashcards[sessionIndex];
            flashcardFace.textContent = carte.reponse;
            flashcardHint.classList.add('hidden');
            flashcardActions.classList.remove('hidden');
            carteRetournee = true;
        });

        async function passerCarteSuivante(maitrisee) {
            const carte = currentFlashcards[sessionIndex];
            if (maitrisee) sessionMaitrisees++;

            supabaseClient
                .from('flashcards')
                .update({
                    niveau_maitrise: maitrisee ? (carte.niveau_maitrise || 0) + 1 : Math.max((carte.niveau_maitrise || 0) - 1, 0),
                    derniere_revision: new Date().toISOString()
                })
                .eq('id', carte.id)
                .then(({ error }) => { if (error) console.error('Erreur maj flashcard:', error); });

            sessionIndex++;

            if (sessionIndex >= currentFlashcards.length) {
                flashcardBox.classList.add('hidden');
                flashcardHint.classList.add('hidden');
                flashcardActions.classList.add('hidden');
                flashcardFin.classList.remove('hidden');
                flashcardFinTexte.textContent = `Session terminée : ${sessionMaitrisees} / ${currentFlashcards.length} carte(s) maîtrisée(s).`;
                lucide.createIcons();
            } else {
                afficherCarteSession();
            }
        }

        flashcardRevoirBtn.addEventListener('click', () => passerCarteSuivante(false));
        flashcardMaitriseBtn.addEventListener('click', () => passerCarteSuivante(true));
        flashcardRecommencerBtn.addEventListener('click', demarrerSessionFlashcards);

        // ------------------------------------------------------------
        // INITIALISATION
        // ------------------------------------------------------------
        afficherEtatVide();
        chargerConversations();
    </script>
</body>
</html>
