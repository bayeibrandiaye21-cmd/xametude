<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>XamÉtudes - Salons d'Entraide</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- KaTeX : affichage des formules mathématiques -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="XamÉtudes">
</head>
<body class="bg-slate-100 font-sans text-slate-800 h-dvh flex flex-col overflow-hidden">

    <!-- NAVBAR TOP -->
    <header class="bg-white border-b border-slate-200 h-16 flex-none z-20">
        <div class="max-w-full mx-auto px-4 sm:px-6 h-full flex items-center justify-between">
            
            <div class="flex items-center gap-4">
                <!-- Bouton Menu Mobile -->
                <button id="toggle-sidebar" class="md:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                    <i data-lucide="menu" class="h-6 w-6"></i>
                </button>

                <!-- Logo -->
                <a href="xam.html" class="flex items-center gap-2 hover:opacity-90 transition">
                    <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-lg tracking-wider">XÉ</div>
                    <span class="text-lg font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent hidden sm:inline">XamÉtudes</span>
                </a>
            </div>

            <!-- Titre du Salon Actuel -->
            <div class="flex items-center gap-2">
                <span class="p-1.5 bg-indigo-100 text-indigo-600 rounded-lg font-bold text-xs">#</span>
                <h1 id="current-channel-title" class="font-bold text-slate-800 text-sm sm:text-base">Chargement...</h1>
            </div>

            <!-- Retour Tableau de Bord -->
            <div class="flex items-center gap-1">
                <div id="notif-bell-container"></div>
                <a href="xam.html" class="text-xs font-semibold text-slate-600 hover:text-indigo-600 transition flex items-center gap-1.5">
                    <i data-lucide="arrow-left" class="h-4 w-4"></i> <span class="hidden sm:inline">Tableau de bord</span>
                </a>
            </div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL (APPLICATION DE CHAT) -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- SIDEBAR (LISTE DES SALONS) -->
        <aside id="sidebar" class="absolute md:relative z-10 w-64 h-full bg-white border-r border-slate-200 flex flex-col transition-transform duration-200 -translate-x-full md:translate-x-0">
            <div class="p-4 border-b border-slate-100">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Salons par Matière</h2>
            </div>

            <nav id="channels-nav" class="flex-1 overflow-y-auto p-3 space-y-1">
                <!-- Généré dynamiquement en JS -->
            </nav>

            <div class="p-3 border-t border-slate-100">
                <div class="bg-slate-50 p-3 rounded-xl flex items-center gap-3">
                    <div id="user-avatar-mini" class="h-8 w-8 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center text-xs">...</div>
                    <div class="overflow-hidden">
                        <div id="user-name-mini" class="text-xs font-bold text-slate-800 truncate">Chargement...</div>
                        <div id="user-class-mini" class="text-[10px] text-indigo-600 font-semibold"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- ZONE DE CHAT -->
        <main class="flex-1 flex flex-col bg-slate-50 overflow-hidden">
            
            <!-- LISTE DES MESSAGES -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                <div class="text-center text-xs text-slate-400 py-10">Chargement des messages...</div>
            </div>

            <!-- BARRE DE SAISIE -->
            <div class="p-3 sm:p-4 bg-white border-t border-slate-200 flex-none">
                <!-- Indicateur d'enregistrement vocal -->
                <div id="recording-indicator" class="hidden max-w-4xl mx-auto mb-2 flex items-center gap-2 bg-red-50 border border-red-200 text-red-600 px-3 py-2 rounded-xl text-xs font-semibold">
                    <span class="h-2 w-2 rounded-full bg-red-500 animate-pulse"></span>
                    Enregistrement en cours... <span id="recording-timer">0:00</span>
                    <button type="button" onclick="annulerEnregistrement()" class="ml-auto text-red-500 hover:text-red-700 font-bold">Annuler</button>
                </div>

                <!-- Aperçu du fichier sélectionné -->
                <div id="file-preview" class="hidden max-w-4xl mx-auto mb-2 flex items-center gap-2 bg-indigo-50 border border-indigo-200 text-indigo-700 px-3 py-2 rounded-xl text-xs font-semibold">
                    <i data-lucide="paperclip" class="h-3.5 w-3.5 flex-none"></i>
                    <span id="file-preview-name" class="truncate flex-1"></span>
                    <button type="button" onclick="annulerFichier()" class="text-indigo-400 hover:text-red-500 font-bold flex-none">
                        <i data-lucide="x" class="h-3.5 w-3.5"></i>
                    </button>
                </div>

                <form id="chat-form" class="flex items-center gap-2 max-w-4xl mx-auto">

                    <input type="file" id="file-input" class="hidden" accept="image/*,video/*,.pdf,.doc,.docx">
                    <button type="button" id="attach-btn" title="Joindre un fichier" class="p-2.5 text-slate-500 hover:text-indigo-600 hover:bg-slate-100 rounded-xl transition flex-none">
                        <i data-lucide="paperclip" class="h-4 w-4"></i>
                    </button>

                    <button type="button" onclick="document.getElementById('chat-input').value = '@IA '; document.getElementById('chat-input').focus();" title="Demander à l'IA" class="p-2.5 text-amber-500 hover:text-amber-600 hover:bg-amber-50 rounded-xl transition flex-none">
                        <i data-lucide="sparkles" class="h-4 w-4"></i>
                    </button>

                    <input type="text" id="chat-input" placeholder="Écris ton message, colle un lien YouTube, ou tape @IA pour poser une question..."
                           class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-xs sm:text-sm">

                    <button type="button" id="mic-btn" title="Message vocal" class="p-2.5 text-slate-500 hover:text-indigo-600 hover:bg-slate-100 rounded-xl transition flex-none">
                        <i data-lucide="mic" class="h-4 w-4"></i>
                    </button>

                    <button type="submit" id="send-btn" class="p-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md shadow-indigo-200 transition flex-none">
                        <i data-lucide="send" class="h-4 w-4"></i>
                    </button>

                </form>
            </div>

        </main>
    </div>

    <!-- SCRIPT JS -->
    <script src="config.js"></script>
    <script>
        lucide.createIcons();

        let currentUser = null;
        let currentProfile = null;
        let currentChannelId = null;
        let currentChannelName = null;
        let realtimeSubscription = null;

        const sidebar = document.getElementById('sidebar');
        const messagesContainer = document.getElementById('messages-container');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        // Toggle Sidebar Mobile
        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
        });

        // ============================================
        // INITIALISATION
        // ============================================
        (async () => {
            currentUser = await verifierConnexion();
            if (!currentUser) return; // redirigé automatiquement vers connexion.html

            currentProfile = await getProfilActuel();

            document.getElementById('user-name-mini').textContent = currentProfile.name;
            document.getElementById('user-class-mini').textContent = currentProfile.class;
            document.getElementById('user-avatar-mini').textContent = currentProfile.initials;
            initNotifBell('notif-bell-container', currentUser.id);

            await chargerSalons();
        })();

        // ============================================
        // CHARGER LA LISTE DES SALONS DEPUIS SUPABASE
        // ============================================
        async function chargerSalons() {
            const { data: channels, error } = await window.supabaseClient
                .from('channels')
                .select('*')
                .order('name');

            if (error || !channels || channels.length === 0) {
                console.error("Erreur chargement salons :", error);
                return;
            }

            const nav = document.getElementById('channels-nav');
            nav.innerHTML = '';

            channels.forEach((ch, index) => {
                const btn = document.createElement('button');
                btn.dataset.channelId = ch.id;
                btn.className = 'channel-btn w-full flex items-center justify-between p-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50 transition';
                btn.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <i data-lucide="${ch.icon || 'message-square'}" class="h-4 w-4"></i>
                        <span>${ch.name}</span>
                    </div>
                `;
                btn.addEventListener('click', () => switchChannel(ch.id, ch.name));
                nav.appendChild(btn);
            });

            lucide.createIcons();

            // Ouvre le premier salon par défaut
            switchChannel(channels[0].id, channels[0].name);
        }

        // ============================================
        // CHANGER DE SALON
        // ============================================
        async function switchChannel(channelId, channelName) {
            currentChannelId = channelId;
            currentChannelName = channelName;

            document.getElementById('current-channel-title').textContent = 'Salon ' + channelName;
            chatInput.placeholder = 'Écris ton message dans #' + channelName + '...';

            // Met en surbrillance le bouton actif
            document.querySelectorAll('.channel-btn').forEach(b => {
                if (b.dataset.channelId === channelId) {
                    b.classList.add('bg-indigo-50', 'text-indigo-600');
                    b.classList.remove('text-slate-600');
                } else {
                    b.classList.remove('bg-indigo-50', 'text-indigo-600');
                    b.classList.add('text-slate-600');
                }
            });

            // Ferme la sidebar sur mobile après sélection
            if (window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
            }

            await chargerMessages(channelId);
            ecouterNouveauxMessages(channelId);
        }

        // ============================================
        // CHARGER LES MESSAGES D'UN SALON
        // ============================================
        async function chargerMessages(channelId) {
            messagesContainer.innerHTML = '<div class="text-center text-xs text-slate-400 py-10">Chargement des messages...</div>';

            const { data: messages, error } = await window.supabaseClient
                .from('messages')
                .select('*, profiles(name, initials)')
                .eq('channel_id', channelId)
                .order('created_at', { ascending: true })
                .limit(100);

            if (error) {
                console.error("Erreur chargement messages :", error);
                messagesContainer.innerHTML = '<div class="text-center text-xs text-red-400 py-10">Erreur de chargement des messages.</div>';
                return;
            }

            messagesContainer.innerHTML = '';

            if (messages.length === 0) {
                messagesContainer.innerHTML = '<div class="text-center text-xs text-slate-400 py-10">Aucun message pour le moment. Sois le premier à écrire !</div>';
                return;
            }

            messages.forEach(afficherMessage);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // ============================================
        // ÉCOUTER LES NOUVEAUX MESSAGES EN TEMPS RÉEL
        // ============================================
        function ecouterNouveauxMessages(channelId) {
            // Ferme l'ancienne écoute avant d'en ouvrir une nouvelle
            if (realtimeSubscription) {
                window.supabaseClient.removeChannel(realtimeSubscription);
            }

            realtimeSubscription = window.supabaseClient
                .channel('messages-' + channelId)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages',
                    filter: `channel_id=eq.${channelId}`
                }, async (payload) => {
                    // Ne pas ré-afficher son propre message (déjà affiché à l'envoi)
                    if (payload.new.user_id === currentUser.id) return;

                    // Récupère le profil de l'auteur pour afficher son nom
                    const { data: authorProfile } = await window.supabaseClient
                        .from('profiles')
                        .select('name, initials')
                        .eq('id', payload.new.user_id)
                        .single();

                    afficherMessage({ ...payload.new, profiles: authorProfile });
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                })
                .on('postgres_changes', {
                    event: 'DELETE',
                    schema: 'public',
                    table: 'messages'
                }, (payload) => {
                    const el = messagesContainer.querySelector(`[data-message-id="${payload.old.id}"]`);
                    if (el) el.remove();
                })
                .subscribe();
        }

        // ============================================
        // SUPPRIMER UN MESSAGE (uniquement les siens)
        // ============================================
        async function supprimerMessage(messageId) {
            const el = messagesContainer.querySelector(`[data-message-id="${messageId}"]`);
            if (el) el.remove();

            const { error } = await window.supabaseClient
                .from('messages')
                .delete()
                .eq('id', messageId);

            if (error) {
                afficherToast(traduireErreur(error), 'error');
            }
        }

        // ============================================
        // CONVERTIR LES LIENS YOUTUBE EN LECTEUR IFRAME (détection robuste)
        // ============================================
        function extraireIdYoutube(url) {
            try {
                const u = new URL(/^https?:\/\//i.test(url) ? url : 'https://' + url);
                const host = u.hostname.replace(/^www\.|^m\.|^music\./, '');

                if (host === 'youtu.be') {
                    return u.pathname.slice(1, 12) || null;
                }
                if (host === 'youtube.com' || host === 'youtube-nocookie.com') {
                    if (u.searchParams.get('v')) return u.searchParams.get('v').slice(0, 11);
                    const parts = u.pathname.split('/').filter(Boolean);
                    if (['shorts', 'embed', 'live'].includes(parts[0])) {
                        return parts[1] ? parts[1].slice(0, 11) : null;
                    }
                }
            } catch (e) { /* URL invalide, on ignore */ }
            return null;
        }

        function parseYouTubeLinks(text) {
            const urlRegex = /(?:https?:\/\/)?(?:[a-zA-Z0-9-]+\.)*(?:youtube\.com|youtu\.be|youtube-nocookie\.com)\/[^\s]+/g;

            return text.replace(urlRegex, function(match) {
                const videoId = extraireIdYoutube(match);
                if (!videoId) return match;

                return `
                    <div class="mt-2 mb-1 rounded-xl overflow-hidden border border-indigo-400/30 shadow-md" style="width: min(260px, 68vw);">
                        <div style="width: 100%; aspect-ratio: 16 / 9;">
                            <iframe 
                                class="w-full h-full rounded-xl block"
                                src="https://www.youtube.com/embed/${videoId}" 
                                title="Vidéo YouTube" 
                                frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                            </iframe>
                        </div>
                    </div>
                `;
            });
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================
        // AFFICHER UN MESSAGE DANS LA CONVERSATION
        // ============================================
        function typeDeFichier(fileName) {
            const ext = (fileName || '').split('.').pop().toLowerCase();
            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) return 'image';
            if (['mp4', 'webm', 'mov', 'ogg'].includes(ext)) return 'video';
            return 'document';
        }

        function construireContenuMessage(msg, isMine) {
            if (msg.type === 'audio') {
                return `<div class="flex items-center gap-2"><i data-lucide="mic" class="h-3.5 w-3.5 flex-none opacity-70"></i><audio controls src="${msg.audio_url}" class="max-w-[220px] h-9" style="filter: ${isMine ? 'invert(1) hue-rotate(180deg)' : 'none'};"></audio></div>`;
            }

            if (msg.type === 'file' && msg.file_url) {
                const ft = typeDeFichier(msg.file_name);
                const safeName = escapeHTML(msg.file_name || 'Fichier');
                if (ft === 'image') {
                    return `<a href="${msg.file_url}" target="_blank"><img src="${msg.file_url}" alt="${safeName}" class="rounded-xl max-w-[220px] max-h-60 object-cover border border-white/20"></a>`;
                }
                if (ft === 'video') {
                    return `<video controls src="${msg.file_url}" class="rounded-xl max-w-[220px] max-h-60"></video>`;
                }
                return `
                    <a href="${msg.file_url}" target="_blank" download="${safeName}" class="flex items-center gap-2 ${isMine ? 'bg-indigo-700/50' : 'bg-slate-100'} px-3 py-2 rounded-xl hover:opacity-80 transition">
                        <i data-lucide="file-text" class="h-4 w-4 flex-none"></i>
                        <span class="text-xs font-semibold truncate max-w-[160px]">${safeName}</span>
                        <i data-lucide="download" class="h-3.5 w-3.5 flex-none ml-auto"></i>
                    </a>
                `;
            }

            return parseYouTubeLinks(formaterTexteRiche(escapeHTML(msg.content)));
        }

        // Convertit un minimum de formatage Markdown (gras, italique, retours à la ligne)
        // Les formules LaTeX ($...$ et $$...$$) sont laissées intactes, KaTeX s'en charge ensuite
        function formaterTexteRiche(text) {
            return text
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                .replace(/\n/g, '<br>');
        }

        function afficherMessage(msg) {
            // Enlève le message "aucun message" si présent
            const emptyMsg = messagesContainer.querySelector('.text-center');
            if (emptyMsg) emptyMsg.remove();

            const isIA = msg.type === 'ai';
            const isMine = !isIA && msg.user_id === currentUser.id;
            const authorName = isIA ? 'Assistant IA' : (isMine ? 'Moi' : (msg.profiles?.name || 'Élève'));
            const authorInitials = isIA ? '🤖' : (msg.profiles?.initials || '??');
            const time = new Date(msg.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

            const contentHTML = construireContenuMessage(msg, isMine);

            const wrapper = document.createElement('div');
            wrapper.style.animation = 'msgIn 0.25s ease';
            wrapper.dataset.messageId = msg.id;

            const deleteBtnHTML = isMine ? `
                <button onclick="supprimerMessage('${msg.id}')" title="Supprimer" class="text-slate-300 hover:text-red-500 transition flex-none">
                    <i data-lucide="trash-2" class="h-3 w-3"></i>
                </button>
            ` : '';

            if (isIA) {
                wrapper.className = 'flex gap-3 max-w-2xl';
                wrapper.innerHTML = `
                    <div class="h-8 w-8 rounded-full bg-gradient-to-br from-amber-400 to-orange-500 text-white font-bold flex flex-none items-center justify-center text-sm shadow-sm">🤖</div>
                    <div>
                        <div class="flex items-baseline gap-2 mb-1">
                            <span class="text-xs font-bold text-amber-700">${authorName}</span>
                            <span class="text-[10px] text-slate-400">${time}</span>
                        </div>
                        <div class="bg-amber-50 p-3.5 rounded-2xl rounded-tl-none border border-amber-200 text-xs text-slate-700 shadow-sm leading-relaxed whitespace-pre-line break-words">
                            ${contentHTML}
                        </div>
                    </div>
                `;
            } else if (isMine) {
                wrapper.className = 'flex gap-3 max-w-2xl ml-auto flex-row-reverse';
                wrapper.innerHTML = `
                    <div class="h-8 w-8 rounded-full bg-indigo-600 text-white font-bold flex flex-none items-center justify-center text-xs">${authorInitials}</div>
                    <div class="text-right">
                        <div class="flex items-baseline gap-2 justify-end mb-1">
                            ${deleteBtnHTML}
                            <span class="text-xs font-bold text-slate-800">${authorName}</span>
                            <span class="text-[10px] text-slate-400">${time}</span>
                        </div>
                        <div class="bg-indigo-600 p-3.5 rounded-2xl rounded-tr-none text-xs text-white shadow-sm leading-relaxed text-left break-words">
                            ${contentHTML}
                        </div>
                    </div>
                `;
            } else {
                wrapper.className = 'flex gap-3 max-w-2xl';
                wrapper.innerHTML = `
                    <a href="profil.html?user=${msg.user_id}" class="h-8 w-8 rounded-full bg-emerald-600 text-white font-bold flex flex-none items-center justify-center text-xs hover:opacity-80 transition">${authorInitials}</a>
                    <div>
                        <div class="flex items-baseline gap-2 mb-1">
                            <a href="profil.html?user=${msg.user_id}" class="text-xs font-bold text-slate-800 hover:text-indigo-600 transition">${authorName}</a>
                            <span class="text-[10px] text-slate-400">${time}</span>
                        </div>
                        <div class="bg-white p-3.5 rounded-2xl rounded-tl-none border border-slate-200 text-xs text-slate-700 shadow-sm leading-relaxed break-words">
                            ${contentHTML}
                        </div>
                    </div>
                `;
            }

            messagesContainer.appendChild(wrapper);
            lucide.createIcons();

            // Rendu des formules mathématiques (utile surtout pour les réponses de l'IA)
            if (window.renderMathInElement) {
                renderMathInElement(wrapper, {
                    delimiters: [
                        { left: '$$', right: '$$', display: true },
                        { left: '$', right: '$', display: false },
                        { left: '\\(', right: '\\)', display: false },
                        { left: '\\[', right: '\\]', display: true }
                    ],
                    throwOnError: false
                });
            }
        }

        // ============================================
        // PIÈCE JOINTE (photo / vidéo / document)
        // ============================================
        const fileInput = document.getElementById('file-input');
        const attachBtn = document.getElementById('attach-btn');
        const filePreview = document.getElementById('file-preview');
        const filePreviewName = document.getElementById('file-preview-name');
        let fichierSelectionne = null;

        attachBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', () => {
            const file = fileInput.files[0];
            if (!file) return;

            if (file.size > 50 * 1024 * 1024) {
                afficherToast('Ce fichier dépasse 50 Mo, choisis-en un plus petit.', 'error');
                fileInput.value = '';
                return;
            }

            fichierSelectionne = file;
            filePreviewName.textContent = file.name;
            filePreview.classList.remove('hidden');
        });

        function annulerFichier() {
            fichierSelectionne = null;
            fileInput.value = '';
            filePreview.classList.add('hidden');
        }

        // ============================================
        // ENVOYER UN MESSAGE (texte et/ou pièce jointe)
        // ============================================
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!currentChannelId) return;
            if (!text && !fichierSelectionne) return;

            const sendBtn = document.getElementById('send-btn');
            sendBtn.disabled = true;

            try {
                let payload = { channel_id: currentChannelId, user_id: currentUser.id, content: text || '' };

                if (fichierSelectionne) {
                    const file = fichierSelectionne;
                    const fileExt = file.name.split('.').pop();
                    const safeName = `${currentUser.id}-${Date.now()}.${fileExt}`;

                    const { error: uploadError } = await window.supabaseClient
                        .storage
                        .from('chat-files')
                        .upload(safeName, file);

                    if (uploadError) throw uploadError;

                    const { data: urlData } = window.supabaseClient
                        .storage
                        .from('chat-files')
                        .getPublicUrl(safeName);

                    payload.type = 'file';
                    payload.file_url = urlData.publicUrl;
                    payload.file_name = file.name;
                    if (!text) payload.content = '📎 ' + file.name;
                }

                chatInput.value = '';
                annulerFichier();

                const { data, error } = await window.supabaseClient
                    .from('messages')
                    .insert(payload)
                    .select()
                    .single();

                if (error) throw error;

                afficherMessage({ ...data, profiles: { name: currentProfile.name, initials: currentProfile.initials } });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

                // Si l'élève a mentionné @IA, on demande à l'assistant de répondre dans le salon
                if (text && /@ia\b/i.test(text)) {
                    demanderIA(text);
                }

            } catch (error) {
                console.error("Erreur envoi message :", error);
                afficherToast(traduireErreur(error), 'error');
            } finally {
                sendBtn.disabled = false;
            }
        });

        // ============================================
        // ASSISTANT IA : appelée quand un message contient @IA
        // ============================================
        async function demanderIA(question) {
            // Petit indicateur "l'IA réfléchit..."
            const thinkingId = 'ia-thinking-' + Date.now();
            const thinkingHTML = `
                <div id="${thinkingId}" class="flex gap-3 max-w-2xl" style="animation: msgIn 0.25s ease;">
                    <div class="h-8 w-8 rounded-full bg-gradient-to-br from-amber-400 to-orange-500 text-white font-bold flex flex-none items-center justify-center text-sm shadow-sm">🤖</div>
                    <div class="bg-amber-50 border border-amber-200 px-3.5 py-2.5 rounded-2xl rounded-tl-none text-xs text-amber-700 font-semibold">
                        L'IA réfléchit...
                    </div>
                </div>
            `;
            messagesContainer.insertAdjacentHTML('beforeend', thinkingHTML);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;

            try {
                const response = await fetch('/api/ask-ia', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        channelId: currentChannelId,
                        question: question.replace(/@ia\b/i, '').trim(),
                        askerName: currentProfile.name
                    })
                });

                if (!response.ok) throw new Error('Réponse IA indisponible');
                // La réponse de l'IA arrivera automatiquement via le temps réel (comme un message normal)

            } catch (err) {
                console.error(err);
                afficherToast("L'assistant IA n'a pas pu répondre pour le moment.", 'error');
            } finally {
                const el = document.getElementById(thinkingId);
                if (el) el.remove();
            }
        }
        // MESSAGES VOCAUX (enregistrement + envoi)
        // ============================================
        let mediaRecorder = null;
        let audioChunks = [];
        let recordingStartTime = null;
        let recordingTimerInterval = null;
        let isCancelled = false;

        const micBtn = document.getElementById('mic-btn');
        const recordingIndicator = document.getElementById('recording-indicator');
        const recordingTimer = document.getElementById('recording-timer');

        micBtn.addEventListener('click', async () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                arreterEnregistrement();
                return;
            }
            await demarrerEnregistrement();
        });

        async function demarrerEnregistrement() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                audioChunks = [];
                isCancelled = false;

                mediaRecorder = new MediaRecorder(stream);
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    stream.getTracks().forEach(track => track.stop());
                    clearInterval(recordingTimerInterval);
                    recordingIndicator.classList.add('hidden');
                    micBtn.classList.remove('text-red-600', 'bg-red-50');

                    if (isCancelled || audioChunks.length === 0) return;

                    const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
                    await envoyerMessageVocal(audioBlob);
                };

                mediaRecorder.start();
                recordingStartTime = Date.now();
                recordingIndicator.classList.remove('hidden');
                micBtn.classList.add('text-red-600', 'bg-red-50');

                recordingTimerInterval = setInterval(() => {
                    const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
                    const mins = Math.floor(elapsed / 60);
                    const secs = elapsed % 60;
                    recordingTimer.textContent = `${mins}:${secs.toString().padStart(2, '0')}`;

                    // Limite de sécurité : 2 minutes max par message vocal
                    if (elapsed >= 120) arreterEnregistrement();
                }, 250);

            } catch (err) {
                console.error(err);
                afficherToast("Impossible d'accéder au microphone. Vérifie les autorisations de ton navigateur.", 'error');
            }
        }

        function arreterEnregistrement() {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop();
            }
        }

        function annulerEnregistrement() {
            isCancelled = true;
            arreterEnregistrement();
        }

        async function envoyerMessageVocal(audioBlob) {
            if (!currentChannelId) return;

            try {
                const fileName = `${currentUser.id}-${Date.now()}.webm`;

                const { error: uploadError } = await window.supabaseClient
                    .storage
                    .from('voice-messages')
                    .upload(fileName, audioBlob);

                if (uploadError) throw uploadError;

                const { data: urlData } = window.supabaseClient
                    .storage
                    .from('voice-messages')
                    .getPublicUrl(fileName);

                const { data, error } = await window.supabaseClient
                    .from('messages')
                    .insert({
                        channel_id: currentChannelId,
                        user_id: currentUser.id,
                        content: '🎤 Message vocal',
                        type: 'audio',
                        audio_url: urlData.publicUrl
                    })
                    .select()
                    .single();

                if (error) throw error;

                afficherMessage({ ...data, profiles: { name: currentProfile.name, initials: currentProfile.initials } });
                messagesContainer.scrollTop = messagesContainer.scrollHeight;

            } catch (err) {
                console.error(err);
                afficherToast(traduireErreur(err), 'error');
            }
        }
    </script>

    <style>
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
