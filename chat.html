<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
    <title>XamÉtudes - Salons d'Entraide</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="XamÉtudes">
</head>
<body class="bg-slate-100 font-sans text-slate-800 h-dvh flex flex-col overflow-hidden">

    <!-- NAVBAR TOP -->
    <header class="bg-white border-b border-slate-200 h-16 flex-none z-20">
        <div class="max-w-full mx-auto px-4 sm:px-6 h-full flex items-center justify-between">
            
            <div class="flex items-center gap-4">
                <!-- Bouton Menu Mobile -->
                <button id="toggle-sidebar" class="md:hidden p-2 text-slate-600 hover:bg-slate-100 rounded-lg">
                    <i data-lucide="menu" class="h-6 w-6"></i>
                </button>

                <!-- Logo -->
                <a href="xam.html" class="flex items-center gap-2 hover:opacity-90 transition">
                    <div class="bg-indigo-600 text-white p-2 rounded-lg font-bold text-lg tracking-wider">XÉ</div>
                    <span class="text-lg font-bold bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent hidden sm:inline">XamÉtudes</span>
                </a>
            </div>

            <!-- Titre du Salon Actuel -->
            <div class="flex items-center gap-2">
                <span class="p-1.5 bg-indigo-100 text-indigo-600 rounded-lg font-bold text-xs">#</span>
                <h1 id="current-channel-title" class="font-bold text-slate-800 text-sm sm:text-base">Chargement...</h1>
            </div>

            <!-- Retour Tableau de Bord -->
            <div class="flex items-center gap-1">
                <div id="notif-bell-container"></div>
                <a href="xam.html" class="text-xs font-semibold text-slate-600 hover:text-indigo-600 transition flex items-center gap-1.5">
                    <i data-lucide="arrow-left" class="h-4 w-4"></i> <span class="hidden sm:inline">Tableau de bord</span>
                </a>
            </div>
        </div>
    </header>

    <!-- CONTENU PRINCIPAL (APPLICATION DE CHAT) -->
    <div class="flex-1 flex overflow-hidden relative">

        <!-- SIDEBAR (LISTE DES SALONS) -->
        <aside id="sidebar" class="absolute md:relative z-10 w-64 h-full bg-white border-r border-slate-200 flex flex-col transition-transform duration-200 -translate-x-full md:translate-x-0">
            <div class="p-4 border-b border-slate-100">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Salons par Matière</h2>
            </div>

            <nav id="channels-nav" class="flex-1 overflow-y-auto p-3 space-y-1">
                <!-- Généré dynamiquement en JS -->
            </nav>

            <div class="p-3 border-t border-slate-100">
                <div class="bg-slate-50 p-3 rounded-xl flex items-center gap-3">
                    <div id="user-avatar-mini" class="h-8 w-8 rounded-full bg-indigo-600 text-white font-bold flex items-center justify-center text-xs">...</div>
                    <div class="overflow-hidden">
                        <div id="user-name-mini" class="text-xs font-bold text-slate-800 truncate">Chargement...</div>
                        <div id="user-class-mini" class="text-[10px] text-indigo-600 font-semibold"></div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- ZONE DE CHAT -->
        <main class="flex-1 flex flex-col bg-slate-50 overflow-hidden">
            
            <!-- LISTE DES MESSAGES -->
            <div id="messages-container" class="flex-1 overflow-y-auto p-4 sm:p-6 space-y-4">
                <div class="text-center text-xs text-slate-400 py-10">Chargement des messages...</div>
            </div>

            <!-- BARRE DE SAISIE -->
            <div class="p-3 sm:p-4 bg-white border-t border-slate-200 flex-none">
                <form id="chat-form" class="flex items-center gap-2 max-w-4xl mx-auto">

                    <input type="text" id="chat-input" placeholder="Écris ton message ou colle un lien YouTube..." required
                           class="flex-1 px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-xs sm:text-sm">

                    <button type="submit" class="p-2.5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl shadow-md shadow-indigo-200 transition">
                        <i data-lucide="send" class="h-4 w-4"></i>
                    </button>

                </form>
            </div>

        </main>
    </div>

    <!-- SCRIPT JS -->
    <script src="config.js"></script>
    <script>
        lucide.createIcons();

        let currentUser = null;
        let currentProfile = null;
        let currentChannelId = null;
        let currentChannelName = null;
        let realtimeSubscription = null;

        const sidebar = document.getElementById('sidebar');
        const messagesContainer = document.getElementById('messages-container');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');

        // Toggle Sidebar Mobile
        document.getElementById('toggle-sidebar').addEventListener('click', () => {
            sidebar.classList.toggle('-translate-x-full');
        });

        // ============================================
        // INITIALISATION
        // ============================================
        (async () => {
            currentUser = await verifierConnexion();
            if (!currentUser) return; // redirigé automatiquement vers connexion.html

            currentProfile = await getProfilActuel();

            document.getElementById('user-name-mini').textContent = currentProfile.name;
            document.getElementById('user-class-mini').textContent = currentProfile.class;
            document.getElementById('user-avatar-mini').textContent = currentProfile.initials;
            initNotifBell('notif-bell-container', currentUser.id);

            await chargerSalons();
        })();

        // ============================================
        // CHARGER LA LISTE DES SALONS DEPUIS SUPABASE
        // ============================================
        async function chargerSalons() {
            const { data: channels, error } = await window.supabaseClient
                .from('channels')
                .select('*')
                .order('name');

            if (error || !channels || channels.length === 0) {
                console.error("Erreur chargement salons :", error);
                return;
            }

            const nav = document.getElementById('channels-nav');
            nav.innerHTML = '';

            channels.forEach((ch, index) => {
                const btn = document.createElement('button');
                btn.dataset.channelId = ch.id;
                btn.className = 'channel-btn w-full flex items-center justify-between p-2.5 rounded-xl text-xs font-semibold text-slate-600 hover:bg-slate-50 transition';
                btn.innerHTML = `
                    <div class="flex items-center gap-2.5">
                        <i data-lucide="${ch.icon || 'message-square'}" class="h-4 w-4"></i>
                        <span>${ch.name}</span>
                    </div>
                `;
                btn.addEventListener('click', () => switchChannel(ch.id, ch.name));
                nav.appendChild(btn);
            });

            lucide.createIcons();

            // Ouvre le premier salon par défaut
            switchChannel(channels[0].id, channels[0].name);
        }

        // ============================================
        // CHANGER DE SALON
        // ============================================
        async function switchChannel(channelId, channelName) {
            currentChannelId = channelId;
            currentChannelName = channelName;

            document.getElementById('current-channel-title').textContent = 'Salon ' + channelName;
            chatInput.placeholder = 'Écris ton message dans #' + channelName + '...';

            // Met en surbrillance le bouton actif
            document.querySelectorAll('.channel-btn').forEach(b => {
                if (b.dataset.channelId === channelId) {
                    b.classList.add('bg-indigo-50', 'text-indigo-600');
                    b.classList.remove('text-slate-600');
                } else {
                    b.classList.remove('bg-indigo-50', 'text-indigo-600');
                    b.classList.add('text-slate-600');
                }
            });

            // Ferme la sidebar sur mobile après sélection
            if (window.innerWidth < 768) {
                sidebar.classList.add('-translate-x-full');
            }

            await chargerMessages(channelId);
            ecouterNouveauxMessages(channelId);
        }

        // ============================================
        // CHARGER LES MESSAGES D'UN SALON
        // ============================================
        async function chargerMessages(channelId) {
            messagesContainer.innerHTML = '<div class="text-center text-xs text-slate-400 py-10">Chargement des messages...</div>';

            const { data: messages, error } = await window.supabaseClient
                .from('messages')
                .select('*, profiles(name, initials)')
                .eq('channel_id', channelId)
                .order('created_at', { ascending: true })
                .limit(100);

            if (error) {
                console.error("Erreur chargement messages :", error);
                messagesContainer.innerHTML = '<div class="text-center text-xs text-red-400 py-10">Erreur de chargement des messages.</div>';
                return;
            }

            messagesContainer.innerHTML = '';

            if (messages.length === 0) {
                messagesContainer.innerHTML = '<div class="text-center text-xs text-slate-400 py-10">Aucun message pour le moment. Sois le premier à écrire !</div>';
                return;
            }

            messages.forEach(afficherMessage);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // ============================================
        // ÉCOUTER LES NOUVEAUX MESSAGES EN TEMPS RÉEL
        // ============================================
        function ecouterNouveauxMessages(channelId) {
            // Ferme l'ancienne écoute avant d'en ouvrir une nouvelle
            if (realtimeSubscription) {
                window.supabaseClient.removeChannel(realtimeSubscription);
            }

            realtimeSubscription = window.supabaseClient
                .channel('messages-' + channelId)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages',
                    filter: `channel_id=eq.${channelId}`
                }, async (payload) => {
                    // Ne pas ré-afficher son propre message (déjà affiché à l'envoi)
                    if (payload.new.user_id === currentUser.id) return;

                    // Récupère le profil de l'auteur pour afficher son nom
                    const { data: authorProfile } = await window.supabaseClient
                        .from('profiles')
                        .select('name, initials')
                        .eq('id', payload.new.user_id)
                        .single();

                    afficherMessage({ ...payload.new, profiles: authorProfile });
                    messagesContainer.scrollTop = messagesContainer.scrollHeight;
                })
                .subscribe();
        }

        // ============================================
        // CONVERTIR LES LIENS YOUTUBE EN LECTEUR IFRAME
        // ============================================
        function parseYouTubeLinks(text) {
            const ytRegex = /(?:https?:\/\/)?(?:www\.)?(?:youtube\.com\/watch\?v=|youtu\.be\/)([a-zA-Z0-9_-]{11})(?:[&\?][^\s]*)?/g;

            return text.replace(ytRegex, function(match, videoId) {
                return `
                    <div class="mt-2 mb-1 rounded-xl overflow-hidden border border-indigo-400/30 shadow-md w-full max-w-sm sm:max-w-md">
                        <div class="relative w-full" style="padding-top: 56.25%;">
                            <iframe 
                                class="absolute top-0 left-0 w-full h-full rounded-xl"
                                src="https://www.youtube.com/embed/${videoId}" 
                                title="Vidéo YouTube" 
                                frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                            </iframe>
                        </div>
                    </div>
                `;
            });
        }

        function escapeHTML(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        // ============================================
        // AFFICHER UN MESSAGE DANS LA CONVERSATION
        // ============================================
        function afficherMessage(msg) {
            // Enlève le message "aucun message" si présent
            const emptyMsg = messagesContainer.querySelector('.text-center');
            if (emptyMsg) emptyMsg.remove();

            const isMine = msg.user_id === currentUser.id;
            const authorName = isMine ? 'Moi' : (msg.profiles?.name || 'Élève');
            const authorInitials = msg.profiles?.initials || '??';
            const time = new Date(msg.created_at).toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            const contentHTML = parseYouTubeLinks(escapeHTML(msg.content));

            const wrapper = document.createElement('div');
            wrapper.style.animation = 'msgIn 0.25s ease';

            if (isMine) {
                wrapper.className = 'flex gap-3 max-w-2xl ml-auto flex-row-reverse';
                wrapper.innerHTML = `
                    <div class="h-8 w-8 rounded-full bg-indigo-600 text-white font-bold flex flex-none items-center justify-center text-xs">${authorInitials}</div>
                    <div class="text-right">
                        <div class="flex items-baseline gap-2 justify-end mb-1">
                            <span class="text-xs font-bold text-slate-800">${authorName}</span>
                            <span class="text-[10px] text-slate-400">${time}</span>
                        </div>
                        <div class="bg-indigo-600 p-3.5 rounded-2xl rounded-tr-none text-xs text-white shadow-sm leading-relaxed text-left">
                            ${contentHTML}
                        </div>
                    </div>
                `;
            } else {
                wrapper.className = 'flex gap-3 max-w-2xl';
                wrapper.innerHTML = `
                    <div class="h-8 w-8 rounded-full bg-emerald-600 text-white font-bold flex flex-none items-center justify-center text-xs">${authorInitials}</div>
                    <div>
                        <div class="flex items-baseline gap-2 mb-1">
                            <span class="text-xs font-bold text-slate-800">${authorName}</span>
                            <span class="text-[10px] text-slate-400">${time}</span>
                        </div>
                        <div class="bg-white p-3.5 rounded-2xl rounded-tl-none border border-slate-200 text-xs text-slate-700 shadow-sm leading-relaxed">
                            ${contentHTML}
                        </div>
                    </div>
                `;
            }

            messagesContainer.appendChild(wrapper);
        }

        // ============================================
        // ENVOYER UN MESSAGE
        // ============================================
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            if (!text || !currentChannelId) return;

            chatInput.value = '';

            const { data, error } = await window.supabaseClient
                .from('messages')
                .insert({ channel_id: currentChannelId, user_id: currentUser.id, content: text })
                .select()
                .single();

            if (error) {
                console.error("Erreur envoi message :", error);
                afficherToast(traduireErreur(error), 'error');
                return;
            }

            afficherMessage({ ...data, profiles: { name: currentProfile.name, initials: currentProfile.initials } });
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        });
    </script>

    <style>
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
