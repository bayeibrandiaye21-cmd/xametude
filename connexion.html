<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XamÉtudes - Connexion</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Librairie Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="XamÉtudes">
</head>
<body class="bg-gradient-to-b from-indigo-900 to-indigo-800 font-sans text-slate-800 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md">

        <!-- Logo -->
        <div class="flex items-center justify-center gap-2 mb-8">
            <div class="bg-white text-indigo-700 p-2.5 rounded-lg font-bold text-2xl tracking-wider">XÉ</div>
            <span class="text-2xl font-bold text-white">XamÉtudes</span>
        </div>

        <!-- Carte principale -->
        <div class="bg-white rounded-2xl shadow-2xl p-6 sm:p-8 space-y-6" style="animation: fadeInUp 0.4s ease;">

            <!-- Onglets Connexion / Inscription -->
            <div class="flex bg-slate-100 rounded-xl p-1">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition bg-white text-indigo-600 shadow-sm">
                    Connexion
                </button>
                <button id="tab-signup" onclick="switchTab('signup')" class="flex-1 py-2.5 text-sm font-bold rounded-lg transition text-slate-500">
                    Inscription
                </button>
            </div>


            <!-- FORMULAIRE CONNEXION -->
            <form id="login-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Email</label>
                    <input type="email" id="login-email" required placeholder="prenom.nom@exemple.com"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Mot de passe</label>
                    <input type="password" id="login-password" required placeholder="••••••••"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-sm">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition flex items-center justify-center gap-2 text-sm">
                    <i data-lucide="log-in" class="h-4 w-4"></i> Se connecter
                </button>
            </form>

            <!-- FORMULAIRE INSCRIPTION -->
            <form id="signup-form" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Nom complet</label>
                    <input type="text" id="signup-name" required placeholder="Ex: Ibra Ndiaye"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Classe</label>
                    <select id="signup-class" required class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-sm">
                        <option value="Terminale S1">Terminale S1</option>
                        <option value="Terminale S2">Terminale S2</option>
                        <option value="Terminale L">Terminale L</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Email</label>
                    <input type="email" id="signup-email" required placeholder="prenom.nom@exemple.com"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-sm">
                </div>
                <div>
                    <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-2">Mot de passe</label>
                    <input type="password" id="signup-password" required minlength="6" placeholder="6 caractères minimum"
                        class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-indigo-500 focus:outline-none transition text-sm">
                </div>
                <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition flex items-center justify-center gap-2 text-sm">
                    <i data-lucide="user-plus" class="h-4 w-4"></i> Créer mon compte
                </button>
            </form>

        </div>

        <p class="text-center text-indigo-200 text-xs mt-6">
            Réservé aux élèves de la classe. Ton compte reste privé et sécurisé.
        </p>
    </div>

    <script src="config.js"></script>
    <script>
        lucide.createIcons();

        function switchTab(tab) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const tabLogin = document.getElementById('tab-login');
            const tabSignup = document.getElementById('tab-signup');

            hideMessage();

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                tabLogin.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                tabLogin.classList.remove('text-slate-500');
                tabSignup.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                tabSignup.classList.add('text-slate-500');
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                tabSignup.classList.add('bg-white', 'text-indigo-600', 'shadow-sm');
                tabSignup.classList.remove('text-slate-500');
                tabLogin.classList.remove('bg-white', 'text-indigo-600', 'shadow-sm');
                tabLogin.classList.add('text-slate-500');
            }
        }

        function showMessage(text, type) {
            afficherToast(text, type === 'error' ? 'error' : 'success');
        }

        function hideMessage() { /* conservé pour compatibilité, ne fait plus rien */ }

        // Si déjà connecté, redirige direct vers le tableau de bord
        (async () => {
            const { data: { session } } = await window.supabaseClient.auth.getSession();
            if (session) window.location.href = "xam.html";
        })();

        // INSCRIPTION
        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            const name = document.getElementById('signup-name').value.trim();
            const classe = document.getElementById('signup-class').value;
            const email = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;

            const { data, error } = await window.supabaseClient.auth.signUp({ email, password });

            if (error) {
                showMessage(traduireErreur(error), 'error');
                return;
            }

            // Calcul des initiales (ex: "Ibra Ndiaye" -> "IN")
            const initials = name.split(' ').map(w => w[0]).join('').substring(0, 2).toUpperCase();

            // Création du profil dans la table "profiles"
            const { error: profileError } = await window.supabaseClient
                .from('profiles')
                .insert({ id: data.user.id, name: name, class: classe, initials: initials });

            if (profileError) {
                showMessage(traduireErreur(profileError), 'error');
                return;
            }

            showMessage("Compte créé avec succès ! Redirection...", 'success');
            setTimeout(() => window.location.href = "xam.html", 1000);
        });

        // CONNEXION
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            hideMessage();

            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            const { error } = await window.supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                showMessage("Email ou mot de passe incorrect.", 'error');
                return;
            }

            window.location.href = "xam.html";
        });
    </script>
    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(16px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
